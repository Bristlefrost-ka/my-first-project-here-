<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My GitHub Linked 3D Project</title>
    
    <script src="https://jsdelivr.net"></script>

    <style>
        html, body, #wrapper { overflow: hidden; width: 100%; height: 100%; margin: 0px; padding: 0px; }
        body { background-color: #000000; }
        #wrapper { display: flex; justify-content: center; align-items: center; }
        canvas { display: block; }
        canvas:focus { outline: none; }
    </style>
</head>
<body id="wrapper">

    <!-- The target window canvas where your sketch draws -->
    <canvas class="sketch"></canvas>

    <!-- Essential frameworks to make Khan Academy processing commands speak with custom code -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/Khan/processing-js@master/processing.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/Mushy-Avocado/KA-exporter@v1.0.1/exporter.js"></script>
    
    <script type="module">
        /* This grabs the script from your GitHub file streaming through jsDelivr */
        runPJS(window.program);
    </script>
</body>
</html>
